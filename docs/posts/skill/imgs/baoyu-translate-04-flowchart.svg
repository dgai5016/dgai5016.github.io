<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif">
<defs>
<linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="500" fill="url(#bg-grad)"/>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" flood-color="#000000"/></filter>
<text x="600" y="61" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">refined 精翻 · 完整流水线</text>
<text x="600" y="91" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.7">分析 → 初译 → 评审 → 修订 → 润色，长文自动分块并行</text>
<rect x="73" y="120" width="195" height="90" rx="12" fill="#0891b2" filter="url(#sh)"/>
<text x="170" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">分析</text>
<text x="170" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">领域/术语/语气</text>
<line x1="269" y1="165" x2="276" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="287,165 276,159 276,171" fill="#ffffff"/>
<rect x="288" y="120" width="195" height="90" rx="12" fill="#06b6d4" filter="url(#sh)"/>
<text x="385" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">初译</text>
<text x="385" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">产出初稿</text>
<line x1="484" y1="165" x2="491" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="502,165 491,159 491,171" fill="#ffffff"/>
<rect x="503" y="120" width="195" height="90" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="600" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">评审</text>
<text x="600" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">只诊断不重写</text>
<line x1="699" y1="165" x2="706" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="717,165 706,159 706,171" fill="#ffffff"/>
<rect x="718" y="120" width="195" height="90" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="815" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">修订</text>
<text x="815" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">按意见改稿</text>
<line x1="914" y1="165" x2="921" y2="165" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="932,165 921,159 921,171" fill="#ffffff"/>
<rect x="933" y="120" width="195" height="90" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="1030" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">润色</text>
<text x="1030" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="400">读着像原创</text>
<rect x="80" y="280" width="1040" height="175" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" opacity="0.06"/>
<text x="600" y="320" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" opacity="0.95">长文分块并行机制（文档超 4000 词时自动触发）</text>
<rect x="167" y="355" width="200" height="70" rx="10" fill="#0891b2" filter="url(#sh)" opacity="0.55"/>
<text x="267" y="395" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">抽全文术语</text>
<line x1="368" y1="390" x2="379" y2="390" stroke="#ffffff" stroke-width="1.6" opacity="0.6"/>
<polygon points="388,390 379,385 379,395" fill="#ffffff"/>
<rect x="389" y="355" width="200" height="70" rx="10" fill="#06b6d4" filter="url(#sh)" opacity="0.55"/>
<text x="489" y="395" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">切成多块</text>
<line x1="590" y1="390" x2="601" y2="390" stroke="#ffffff" stroke-width="1.6" opacity="0.6"/>
<polygon points="610,390 601,385 601,395" fill="#ffffff"/>
<rect x="611" y="355" width="200" height="70" rx="10" fill="#6c63ff" filter="url(#sh)" opacity="0.55"/>
<text x="711" y="395" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">每块并行翻译</text>
<line x1="812" y1="390" x2="823" y2="390" stroke="#ffffff" stroke-width="1.6" opacity="0.6"/>
<polygon points="832,390 823,385 823,395" fill="#ffffff"/>
<rect x="833" y="355" width="200" height="70" rx="10" fill="#a78bfa" filter="url(#sh)" opacity="0.55"/>
<text x="933" y="395" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">合并 + 术语对齐</text>
</svg>