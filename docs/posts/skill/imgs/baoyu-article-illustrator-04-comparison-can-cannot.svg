<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif">
<defs>
<linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="520" fill="url(#bg-grad)"/>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" flood-color="#000000"/></filter>
<text x="600" y="92" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700">能做 vs 不能做 · 边界</text>
<text x="600" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.6">Can do / Cannot do</text>
<line x1="600" y1="150" x2="600" y2="480" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
<rect x="60" y="150" width="500" height="40" rx="10" fill="#34d399"/>
<text x="310" y="177" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">✓ 能做</text>
<rect x="60" y="190" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="1.2" filter="url(#sh)"/>
<text x="82" y="224" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">自动定位配图点 · 三维批量出图</text>
<rect x="60" y="262" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="1.2" filter="url(#sh)"/>
<text x="82" y="296" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">预设快捷 / 单维度覆盖 / 参考图引导</text>
<rect x="60" y="334" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="1.2" filter="url(#sh)"/>
<text x="82" y="368" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">自动把图引用插回原文段落</text>
<rect x="60" y="406" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="1.2" filter="url(#sh)"/>
<text x="82" y="440" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">跨运行时自动选用原生出图后端</text>
<rect x="640" y="150" width="500" height="40" rx="10" fill="#f472b6"/>
<text x="890" y="177" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">✗ 不能做</text>
<rect x="640" y="190" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#f472b6" stroke-width="1.2" filter="url(#sh)"/>
<text x="662" y="224" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">不用 SVG/HTML/canvas 替代位图</text>
<rect x="640" y="262" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#f472b6" stroke-width="1.2" filter="url(#sh)"/>
<text x="662" y="296" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">不在位图上用代码涂改覆盖文字</text>
<rect x="640" y="334" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#f472b6" stroke-width="1.2" filter="url(#sh)"/>
<text x="662" y="368" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">prompt 文件落盘前不出图</text>
<rect x="640" y="406" width="500" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="#f472b6" stroke-width="1.2" filter="url(#sh)"/>
<text x="662" y="440" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="500">不跳过确认（需当次明示授权）</text>
</svg>