<text x="430" y="266" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="46" fill="#ffffff" text-anchor="middle" font-weight="800" opacity="0.9">×</text>
