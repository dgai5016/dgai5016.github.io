<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif">
<defs>
<linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="460" fill="url(#bg-grad)"/>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" flood-color="#000000"/></filter>
<text x="600" y="92" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700">内部 6 步工作流</text>
<text x="600" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.6">第 3 步「确认设置」为硬门槛 — 不确认不走下一步</text>
<rect x="50" y="250" width="160" height="100" rx="12" fill="#0891b2" filter="url(#sh)"/>
<text x="130" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">前置检查</text>
<circle cx="130" cy="220" r="20" fill="#0891b2" filter="url(#sh)"/>
<text x="130" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<line x1="212" y1="300" x2="225" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="236,300 225,294 225,306" fill="#ffffff"/>
<rect x="238" y="250" width="160" height="100" rx="12" fill="#06b6d4" filter="url(#sh)"/>
<text x="318" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">分析文章</text>
<circle cx="318" cy="220" r="20" fill="#06b6d4" filter="url(#sh)"/>
<text x="318" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<line x1="400" y1="300" x2="413" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="424,300 413,294 413,306" fill="#ffffff"/>
<rect x="426" y="250" width="160" height="100" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="506" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">确认设置</text>
<circle cx="506" cy="220" r="20" fill="#f59e0b" filter="url(#sh)"/>
<text x="506" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="454" y="364" width="104" height="30" rx="8" fill="#f59e0b" filter="url(#sh)"/>
<text x="506" y="384" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">硬门槛</text>
<line x1="588" y1="300" x2="601" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="612,300 601,294 601,306" fill="#ffffff"/>
<rect x="614" y="250" width="160" height="100" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="694" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">生成大纲</text>
<circle cx="694" cy="220" r="20" fill="#a78bfa" filter="url(#sh)"/>
<text x="694" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<line x1="776" y1="300" x2="789" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="800,300 789,294 789,306" fill="#ffffff"/>
<rect x="802" y="250" width="160" height="100" rx="12" fill="#34d399" filter="url(#sh)"/>
<text x="882" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">生成图片</text>
<circle cx="882" cy="220" r="20" fill="#34d399" filter="url(#sh)"/>
<text x="882" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<line x1="964" y1="300" x2="977" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
<polygon points="988,300 977,294 977,306" fill="#ffffff"/>
<rect x="990" y="250" width="160" height="100" rx="12" fill="#f472b6" filter="url(#sh)"/>
<text x="1070" y="307" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">收尾插回</text>
<circle cx="1070" cy="220" r="20" fill="#f472b6" filter="url(#sh)"/>
<text x="1070" y="227" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
</svg>