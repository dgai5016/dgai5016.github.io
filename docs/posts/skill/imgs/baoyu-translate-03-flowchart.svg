<text x="600" y="268" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">分析</text>
