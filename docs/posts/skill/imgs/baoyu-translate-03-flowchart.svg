<text x="180" y="268" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">抓取</text>
<circle cx="180" cy="178" r="20" fill="#ffffff" filter="url(#sh)"/>
