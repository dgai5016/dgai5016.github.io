<text x="600" y="185" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#6c63ff" text-anchor="middle" font-weight="700">3</text>
