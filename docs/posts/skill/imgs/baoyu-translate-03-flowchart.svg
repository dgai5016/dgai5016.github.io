<text x="390" y="268" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">物化</text>
<circle cx="390" cy="178" r="20" fill="#ffffff" filter="url(#sh)"/>
<text x="390" y="185" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#06b6d4" text-anchor="middle" font-weight="700">2</text>
