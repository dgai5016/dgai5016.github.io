# 主题：兴趣 —— 文件名即主题 id，加入新主题只需新建一个 yaml 文件
name: 兴趣
order: 9 # 排序权重，小的排前面；不写默认排到最后
books:
  # 每本书字段：title 书名 / author 作者（多人用「、」分隔，翻译书写原作者）
  # / translator 可选（译者，多人用「、」分隔，中文原创书不写）
  # / publisher 可选（出版社）/ pubDate 可选（出版时间，格式 "YYYY-MM" 或 "YYYY"，必须带引号）
  # / cover 可选（封面图片路径，图片存 docs/public/covers/books/ 下，这里写站点绝对路径如 /covers/books/xxx.jpg）
  # / jd 可选（京东商品页链接，写了书名可点击跳转）
  # / douban 可选（豆瓣条目链接，显示豆瓣胶囊；豆瓣未收录的书不写）
  # / weread 可选（微信读书链接）
  # / status 可选（写「读完」显示绿胶囊）
  # / level 可选（难度等级：简单/中等/困难，只影响排序不在页面显示；未写排在最后）
  # 主题内按 简单→中等→困难 由易到难排序，同级内保持本文件书写顺序；「读完」只是状态标签不影响排序
  # 书名含「冒号+空格」时必须用引号包起来，否则 YAML 解析会出错
  - title: 《富士微单摄影入门》
    level: 简单
    author: 雷波 编著
    publisher: 化学工业出版社
    pubDate: "2019-05"
    cover: /covers/books/fujifilm-mirrorless.jpg
    douban: https://book.douban.com/subject/33429457/
    weread: https://weread.qq.com/web/reader/666329c071c966d566692e8#outline?noScroll=1
