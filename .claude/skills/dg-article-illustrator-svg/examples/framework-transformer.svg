<text x="600" y="229" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">Multi-Head Self-Attention</text>
<line x1="600" y1="164" x2="600" y2="167" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<polygon points="600,178 606,167 594,167" fill="#ffffff"/>
<rect x="420" y="248" width="360" height="56" rx="12" fill="#6c63ff" filter="url(#sh)"/>
<text x="600" y="276" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600">Add &amp; LayerNorm</text>
<text x="600" y="299" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">残差连接 + 层归一化</text>
<line x1="600" y1="234" x2="600" y2="237" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<polygon points="600,248 606,237 594,237" fill="#ffffff"/>
<rect x="420" y="318" width="360" height="56" rx="12" fill="#a78bfa" filter="url(#sh)"/>
<text x="600" y="346" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600">前馈网络</text>
<text x="600" y="369" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">Feed-Forward (MLP)</text>
<line x1="600" y1="304" x2="600" y2="307" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<polygon points="600,318 606,307 594,307" fill="#ffffff"/>
<rect x="420" y="388" width="360" height="56" rx="12" fill="#34d399" filter="url(#sh)"/>
<text x="600" y="416" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600">Add &amp; LayerNorm</text>
<text x="600" y="439" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">残差连接 + 层归一化</text>
<line x1="600" y1="374" x2="600" y2="377" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<polygon points="600,388 606,377 594,377" fill="#ffffff"/>
<rect x="420" y="458" width="360" height="56" rx="12" fill="#f472b6" filter="url(#sh)"/>
<text x="600" y="486" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600">输出</text>
<text x="600" y="509" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="400">送入下一层 / 预测</text>
<line x1="600" y1="444" x2="600" y2="447" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<polygon points="600,458 606,447 594,447" fill="#ffffff"/>
</svg>